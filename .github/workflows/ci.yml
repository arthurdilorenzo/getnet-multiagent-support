name: Getnet Multi-Agent CI & Evaluation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    name: Unit Tests, Security Boundaries & Groundedness Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify zero print() statements in production code
        run: |
          if grep -rn "print(" app/; then
            echo "Found forbidden print() call in app/ directory"
            exit 1
          fi

      - name: Run Unit, Security, Resilience, Memory & Scenario Tests
        run: |
          pytest -v

      - name: Run Automated Multi-Agent Evaluation Suite (Routing, Tool Recall & Groundedness)
        run: |
          python -m app.evals.evaluator
