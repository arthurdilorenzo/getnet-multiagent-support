name: Getnet Multi-Agent CI & Evaluation Pipeline

on:
  push:
    branches: [ main, master, 'codex/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-evaluate:
    name: Unit Tests, Security Boundaries & Groundedness Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Verify zero print() statements in production code
        run: python scripts/check_no_print.py app

      - name: Run Unit, Security, Resilience, Memory & Scenario Tests
        run: |
          pytest -v

      - name: Run Automated Multi-Agent Evaluation Suite (Routing, Tool Recall & Groundedness)
        run: |
          python -m app.evals.evaluator

      - name: Build non-root image and smoke strict auth, chat, tenant isolation and restart persistence
        run: python scripts/docker_smoke.py --image getnet-v4-ci --output /tmp/docker-smoke.json

      - name: Upload container verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-evidence
          path: /tmp/docker-smoke.json
