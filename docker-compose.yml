services:
  getnet-multiagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: getnet-multiagent-support
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - AUTH_API_KEY=${AUTH_API_KEY:?Provide a randomly generated AUTH_API_KEY (32+ characters)}
      - JWT_SECRET=${JWT_SECRET:?Provide an independent randomly generated JWT_SECRET (32+ characters)}
      - AUTH_ENFORCE_STRICT=true
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - HITL_WEBHOOK_URL=${HITL_WEBHOOK_URL:-}
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - getnet_sqlite_state:/app/state
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  getnet_sqlite_state:
